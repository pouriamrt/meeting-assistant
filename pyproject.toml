[project]
name = "assistant"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121.0",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.2",
    "pyaudiowpatch>=0.2.12.8",
    "pynput>=1.8.2",
    "soxr>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
