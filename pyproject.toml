[project]
name = "assistant"
version = "0.1.0"
description = "Local meeting assistant: dual capture, local whisper, cue cards in a capture-excluded overlay"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121.0",
    "faster-whisper>=1.2.1",
    "mss>=10.2.0",
    "numpy>=2.5.2",
    "pyaudiowpatch>=0.2.12.8",
    "pynput>=1.8.2",
    "soxr>=1.1.0",
]

[project.scripts]
meeting-assistant = "assistant.main:main"

# Without a build backend uv treats this as a bare application, never
# installs it into the venv, and [project.scripts] is silently inert -
# `uv run meeting-assistant` then does not exist.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]

[dependency-groups]
dev = [
    "hypothesis>=6.165.8",
    "pyinstaller>=6.22.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
